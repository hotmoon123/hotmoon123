<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RentFlow CRM{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/fluency/48/rent.png">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div class="brand"><span>🏢</span> RentFlow CRM</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login/">Login</a>
            <a href="/register/">Register</a>
        </div>
    </nav>
    <main class="auth-shell">
        <div class="auth-card animate__animated animate__fadeInUp">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="footer">
        RentFlow CRM · Built for Ghanaian landlords and tenants · RMU BCE0000725 | BIT00021427 | BIT3105227
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
