{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — RentFlow CRM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/fluency/48/rent.png">
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="font-size: 32px; margin-bottom: 12px;">🔑</div>
                <h1 style="font-size: 24px; font-weight: 700; color: var(--text-primary); margin: 0;">Create New Password</h1>
                <p style="color: var(--text-secondary); font-size: 14px; margin: 8px 0 0 0;">Choose a strong password to secure your account</p>
            </div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label class="form-label" for="password">New Password</label>
                    <input type="password" id="password" name="password" class="glass-input" placeholder="••••••••" required minlength="8">
                </div>

                <div class="form-group">
                    <label class="form-label" for="passwordConfirm">Confirm Password</label>
                    <input type="password" id="passwordConfirm" name="password_confirm" class="glass-input" placeholder="••••••••" required minlength="8">
                </div>

                <div style="background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.3); border-radius: 12px; padding: 12px; margin-bottom: 20px; font-size: 13px; color: var(--text-secondary);">
                    <i class="ph ph-info" style="margin-right: 6px;"></i>
                    Password must be at least 8 characters long with a mix of letters and numbers.
                </div>

                <div id="errorMessage" class="glass-alert alert-danger" style="display: none; margin-bottom: 20px;">
                    <i class="ph ph-warning-circle"></i>
                    <span id="errorText"></span>
                </div>

                <button type="submit" class="btn-glass-primary" style="width: 100%; margin-bottom: 16px;">
                    <i class="ph ph-check-circle" style="margin-right: 8px;"></i>
                    Update Password
                </button>
            </form>

            <div style="text-align: center; padding: 16px 0; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 20px;">
                <a href="/login/" style="font-size: 13px; color: var(--primary-light); text-decoration: none;">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            if (password !== passwordConfirm) {
                document.getElementById('errorText').textContent = 'Passwords do not match';
                errorDiv.style.display = 'flex';
                return;
            }

            if (password.length < 8) {
                document.getElementById('errorText').textContent = 'Password must be at least 8 characters long';
                errorDiv.style.display = 'flex';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                document.getElementById('errorText').textContent = 'Invalid or missing reset token';
                errorDiv.style.display = 'flex';
                return;
            }

            try {
                const response = await fetch('/auth/reset-password/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ token, password, password_confirm: passwordConfirm })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showToast('Password updated successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login/';
                    }, 1500);
                } else {
                    document.getElementById('errorText').textContent = data.error || 'Failed to reset password. Please try again.';
                    errorDiv.style.display = 'flex';
                }
            } catch (error) {
                document.getElementById('errorText').textContent = 'An error occurred. Please try again.';
                errorDiv.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
