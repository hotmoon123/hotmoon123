{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — RentFlow CRM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/fluency/48/rent.png">
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="font-size: 32px; margin-bottom: 12px;">🔐</div>
                <h1 style="font-size: 24px; font-weight: 700; color: var(--text-primary); margin: 0;">Reset Password</h1>
                <p style="color: var(--text-secondary); font-size: 14px; margin: 8px 0 0 0;">Enter your email to receive a reset link</p>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="glass-input" placeholder="your@example.com" required>
                </div>

                <div id="successMessage" class="glass-alert alert-success" style="display: none; margin-bottom: 20px;">
                    <i class="ph ph-check-circle"></i>
                    <span id="successText">Check your email for a password reset link</span>
                </div>

                <div id="errorMessage" class="glass-alert alert-danger" style="display: none; margin-bottom: 20px;">
                    <i class="ph ph-warning-circle"></i>
                    <span id="errorText"></span>
                </div>

                <button type="submit" class="btn-glass-primary" style="width: 100%; margin-bottom: 16px;">
                    <i class="ph ph-paper-plane-tilt" style="margin-right: 8px;"></i>
                    Send Reset Link
                </button>
            </form>

            <div style="text-align: center; padding: 16px 0; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 20px;">
                <p style="font-size: 14px; color: var(--text-secondary); margin: 0 0 12px 0;">Remember your password?</p>
                <a href="/login/" class="btn-glass-secondary" style="text-decoration: none; display: inline-block;">Back to Login</a>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <p style="font-size: 13px; color: var(--text-secondary); margin: 0;">Need immediate help? Contact support@rentflow.crm</p>
            </div>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const email = document.getElementById('email').value.trim();

            try {
                const response = await fetch('/auth/forgot-password/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successDiv.style.display = 'flex';
                    document.getElementById('forgotPasswordForm').reset();
                    showToast('Reset link sent! Check your email.', 'success');
                } else {
                    document.getElementById('errorText').textContent = data.error || 'Failed to send reset link. Please try again.';
                    errorDiv.style.display = 'flex';
                }
            } catch (error) {
                document.getElementById('errorText').textContent = 'An error occurred. Please try again.';
                errorDiv.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
