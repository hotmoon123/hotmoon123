{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — RentFlow CRM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/fluency/48/rent.png">
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="font-size: 32px; margin-bottom: 12px;">🏢</div>
                <h1 style="font-size: 24px; font-weight: 700; color: var(--text-primary); margin: 0;">RentFlow</h1>
                <p style="color: var(--text-secondary); font-size: 14px; margin: 8px 0 0 0;">Property Management System</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="glass-input" placeholder="landlord@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="glass-input" placeholder="••••••••" required>
                </div>

                <div id="errorMessage" class="glass-alert alert-danger" style="display: none; margin-bottom: 20px;">
                    <i class="ph ph-warning-circle"></i>
                    <span id="errorText"></span>
                </div>

                <button type="submit" class="btn-glass-primary" style="width: 100%; margin-bottom: 16px;">
                    <i class="ph ph-sign-in" style="margin-right: 8px;"></i>
                    Sign In
                </button>
            </form>

            <div style="text-align: center; padding: 16px 0; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 20px;">
                <p style="font-size: 14px; color: var(--text-secondary); margin: 0 0 12px 0;">Don't have an account?</p>
                <a href="/register/" class="btn-glass-secondary" style="text-decoration: none; display: inline-block;">Create Account</a>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="/forgot-password/" style="font-size: 13px; color: var(--primary-light); text-decoration: none;">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showToast('Login successful!', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/landlord/dashboard/';
                    }, 1500);
                } else {
                    document.getElementById('errorText').textContent = data.error || 'Login failed. Please try again.';
                    errorDiv.style.display = 'flex';
                }
            } catch (error) {
                document.getElementById('errorText').textContent = 'An error occurred. Please try again.';
                errorDiv.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
