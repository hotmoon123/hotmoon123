{% extends "base.html" %}
{% block title %}Chat - RentFlow{% endblock %}
{% block content %}
<div class="header"><h1>Messages</h1></div>
<div style="display: grid; grid-template-columns: 250px 1fr; gap: 20px;">
    <div class="card" style="max-height: 500px; overflow-y: auto;">
        <h3>Conversations</h3>
        <div style="font-size: 14px; color: #666;">No conversations yet</div>
    </div>
    <div class="card" style="max-height: 500px; display: flex; flex-direction: column;">
        <h3>Messages</h3>
        <div style="flex: 1; overflow-y: auto; font-size: 14px; color: #666;">Select a conversation</div>
        <input type="text" placeholder="Type message..." style="padding: 10px; border: 1px solid #ddd; margin-top: auto;">
    </div>
</div>
{% endblock %}
