{% extends "base_landlord.html" %}

{% block title %}Create Property - RentFlow{% endblock %}

{% block content %}
<div class="header">
    <h1>Create Property</h1>
</div>

<div style="max-width: 600px;">
    <div class="card">
        <form id="propertyForm">
            <div class="form-group">
                <label for="unitNumber">Unit Number *</label>
                <input type="text" id="unitNumber" name="unit_number" required>
            </div>
            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="propertyType">Property Type *</label>
                <select id="propertyType" name="property_type" required>
                    <option value="apartment">Apartment</option>
                    <option value="house">House</option>
                    <option value="duplex">Duplex</option>
                    <option value="bungalow">Bungalow</option>
                    <option value="commercial">Commercial</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="rentAmount">Rent Amount (₵) *</label>
                <input type="number" id="rentAmount" name="rent_amount" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4"></textarea>
            </div>
            <div id="errorMessage" class="error" style="display: none;"></div>
            <button type="submit" class="button">Create Property</button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('propertyForm');
    const errorDiv = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.style.display = 'none';

        const formData = {
            unit_number: document.getElementById('unitNumber').value,
            address: document.getElementById('address').value,
            property_type: document.getElementById('propertyType').value,
            rent_amount: document.getElementById('rentAmount').value,
            description: document.getElementById('description').value,
        };

        try {
            const response = await fetch('/properties/create/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify(formData),
            });

            const data = await response.json();

            if (response.ok && data.success) {
                window.location.href = `/properties/${data.property_id}/detail/`;
            } else {
                errorDiv.textContent = data.error || 'Failed to create property';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = 'An error occurred. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}
