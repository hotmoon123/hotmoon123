{% extends "base.html" %}
{% block title %}Settings - RentFlow{% endblock %}
{% block content %}
<div class="header"><h1>Settings</h1></div>
<div style="max-width: 600px;">
    <div class="card">
        <h2>Account Settings</h2>
        <form id="settingsForm">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" value="" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" value="" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="" disabled>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" value="">
            </div>
            <button type="submit" class="button">Save Changes</button>
        </form>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h2>Change Password</h2>
        <form id="passwordForm">
            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit" class="button">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
