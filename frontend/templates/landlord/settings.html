{% extends "base_landlord.html" %}

{% block title %}Settings - RentFlow{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Settings & Profile</h1>
    <p>Manage your account and system preferences</p>
</div>

<div class="grid grid-2">
    <div class="card">
        <h2>Account Information</h2>
        <div class="form-group">
            <label>First Name</label>
            <input type="text" placeholder="John" disabled>
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text" placeholder="Owusu" disabled>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="landlord@example.com" disabled>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="+233 XX XXX XXXX">
        </div>
        <div class="form-group">
            <label>Company Name</label>
            <input type="text" placeholder="Your Company">
        </div>
        <button class="button button-block">Save Changes</button>
    </div>

    <div class="card">
        <h2>Security</h2>
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" placeholder="••••••••">
        </div>
        <button class="button button-block">Change Password</button>
        <p class="text-muted" style="font-size: 0.875rem; margin-top: 1rem;">Last login: Never</p>
    </div>
</div>

<div class="card">
    <h2>Bank & Payment Settings</h2>
    <div class="grid grid-3">
        <div class="form-group">
            <label>Bank Name</label>
            <input type="text" placeholder="Your Bank">
        </div>
        <div class="form-group">
            <label>Account Number</label>
            <input type="text" placeholder="XXXXXXXXXX">
        </div>
        <div class="form-group">
            <label>Routing Number</label>
            <input type="text" placeholder="XXXXXXXXXX">
        </div>
    </div>
    <div class="form-group">
        <label>MoMo Number</label>
        <input type="tel" placeholder="+233 XX XXX XXXX">
    </div>
    <button class="button">Save Payment Settings</button>
</div>
{% endblock %}
