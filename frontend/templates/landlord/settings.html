{% extends "base_landlord.html" %}

{% block title %}Settings — RentFlow{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Workspace settings</h1>
        <p class="page-subtitle">Manage account preferences, notifications, and property defaults.</p>
    </div>
</div>

<div class="card-grid card-grid-2">
    <div class="card form-card">
        <h2 class="card-title">Account details</h2>
        <div class="form-group"><label>Email</label><input value="{{ user.email }}" disabled></div>
        <div class="form-group"><label>Owner name</label><input value="{{ user.full_name }}" disabled></div>
        <div class="form-group"><label>Company</label><input value="{{ user.company_name|default:'RentFlow Landlord' }}" disabled></div>
    </div>
    <div class="card form-card">
        <h2 class="card-title">Security</h2>
        <div class="form-group"><label>Change password</label><button class="button button-secondary" type="button">Update password</button></div>
        <div class="form-group">
            <label>Notifications</label>
            <div class="input-group">
                <label><input type="checkbox" checked> New lease notifications</label>
                <label><input type="checkbox" checked> Payment reminders</label>
                <label><input type="checkbox"> Maintenance alerts</label>
            </div>
        </div>
    </div>
</div>
{% endblock %}
