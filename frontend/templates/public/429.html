{% extends "base/base.html" %}

{% block title %}Too Many Requests | Rent & Lease Management{% endblock %}

{% block layout %}
<div class="error-wrapper error-429">
    <div class="error-code anim-shake">429</div>
    <h2 class="error-title anim-slide-up" style="animation-delay: 0.1s;">Too Many Requests</h2>
    <p class="error-message anim-slide-up" style="animation-delay: 0.2s;">
        You've been rate-limited for making too many requests in a short period. Please wait a few minutes before trying again.
    </p>
    <div class="anim-slide-up" style="animation-delay: 0.3s;">
        <a href="/" class="btn btn-primary">Return Home</a>
    </div>
</div>
{% endblock %}
