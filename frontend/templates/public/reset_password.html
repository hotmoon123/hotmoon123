{% extends "base.html" %}

{% block title %}Reset Password - RentFlow{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card">
        <h2>Reset Password</h2>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="passwordConfirm">Confirm Password</label>
                <input type="password" id="passwordConfirm" name="password_confirm" required>
            </div>
            <div id="errorMessage" class="error" style="display: none;"></div>
            <button type="submit" class="button" style="width: 100%; margin-bottom: 15px;">Reset Password</button>
        </form>
        <p style="text-align: center; font-size: 14px;">
            <a href="/login/" style="color: #0066cc;">Back to Login</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.style.display = 'none';

        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;

        if (password !== passwordConfirm) {
            errorDiv.textContent = 'Passwords do not match';
            errorDiv.style.display = 'block';
            return;
        }

        const token = new URLSearchParams(window.location.search).get('token');

        try {
            const response = await fetch('/auth/reset-password/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ token, password, password_confirm: passwordConfirm }),
            });

            const data = await response.json();

            if (response.ok && data.success) {
                window.location.href = '/login/';
            } else {
                errorDiv.textContent = data.error || 'Failed to reset password';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = 'An error occurred. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}
