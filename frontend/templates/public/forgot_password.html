{% extends "base.html" %}

{% block title %}Forgot Password - RentFlow{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <div class="card">
        <h2>Forgot Password</h2>
        <p style="color: #666; margin-bottom: 20px;">Enter your email address and we'll send you a link to reset your password.</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div id="errorMessage" class="error" style="display: none;"></div>
            <div id="successMessage" class="success" style="display: none;"></div>
            <button type="submit" class="button" style="width: 100%; margin-bottom: 15px;">Send Reset Link</button>
        </form>
        <p style="text-align: center; font-size: 14px;">
            Remember your password? <a href="/login/" style="color: #0066cc;">Login here</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        const email = document.getElementById('email').value;

        try {
            const response = await fetch('/auth/forgot-password/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ email }),
            });

            const data = await response.json();

            if (response.ok && data.success) {
                successDiv.textContent = 'Password reset link sent to your email.';
                successDiv.style.display = 'block';
                document.getElementById('forgotPasswordForm').reset();
            } else {
                errorDiv.textContent = data.error || 'Failed to send reset link';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = 'An error occurred. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}
