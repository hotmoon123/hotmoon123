{% extends "base/base.html" %}

{% block title %}Access Denied | Rent & Lease Management{% endblock %}

{% block layout %}
<div class="error-wrapper">
    <div class="error-code anim-slide-up">403</div>
    <h2 class="error-title anim-slide-up" style="animation-delay: 0.1s;">Access Denied</h2>
    <p class="error-message anim-slide-up" style="animation-delay: 0.2s;">
        You don't have permission to access this resource. If you believe this is a mistake, please contact support.
    </p>
    <div class="anim-slide-up" style="animation-delay: 0.3s;">
        <button onclick="window.history.back()" class="btn btn-secondary me-2">Go Back</button>
        <a href="/" class="btn btn-primary">Return Home</a>
    </div>
</div>
{% endblock %}
