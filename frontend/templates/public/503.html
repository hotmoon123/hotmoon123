{% extends "base/base.html" %}

{% block title %}Service Unavailable | Rent & Lease Management{% endblock %}

{% block layout %}
<div class="error-wrapper error-503">
    <div class="error-code anim-pulse">503</div>
    <h2 class="error-title anim-slide-up" style="animation-delay: 0.1s;">System Maintenance</h2>
    <p class="error-message anim-slide-up" style="animation-delay: 0.2s;">
        RentFlow is currently undergoing scheduled maintenance. We'll be back online shortly. Thank you for your patience.
    </p>
</div>
{% endblock %}
