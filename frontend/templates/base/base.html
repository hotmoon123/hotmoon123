<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Rent & Lease Management{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Global CSS Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css"/>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="/static/css/design_system.css">

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">

    {% block layout %}{% endblock %}

    <!-- Bootstrap JS (bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Global JS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Helper to show toasts
        function showToast(message, type = 'success') {
            const bgColors = {
                'success': "var(--color-emerald)",
                'error': "var(--color-red)",
                'warning': "var(--color-amber)",
                'info': "var(--color-blue-accent)"
            };
            
            Toastify({
                text: message,
                duration: 3000,
                close: true,
                gravity: "top", // `top` or `bottom`
                position: "right", // `left`, `center` or `right`
                style: {
                    background: bgColors[type] || bgColors['info'],
                    borderRadius: "8px",
                    fontFamily: "var(--font-family)",
                    fontSize: "14px",
                    fontWeight: "500"
                }
            }).showToast();
        }
    </script>

    <!-- Base JS -->
    <script src="/static/js/api.js"></script> <!-- Will create this for API fetch logic -->

    {% block extra_js %}{% endblock %}
</body>
</html>
