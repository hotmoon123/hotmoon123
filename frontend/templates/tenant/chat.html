{% extends "base.html" %}
{% block title %}Messages - RentFlow{% endblock %}
{% block content %}
<div class="header"><h1>Messages with Landlord</h1></div>
<div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
    <div class="card" style="max-height: 500px; display: flex; flex-direction: column;">
        <div style="flex: 1; overflow-y: auto; margin-bottom: 20px; color: #666; font-size: 14px;">
            No messages yet. Start a conversation with your landlord.
        </div>
        <input type="text" placeholder="Type message..." style="padding: 10px; border: 1px solid #ddd;">
    </div>
</div>
{% endblock %}
