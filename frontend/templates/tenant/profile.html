{% extends "base_tenant.html" %}

{% block title %}My Profile - RentFlow{% endblock %}

{% block content %}
<div class="page-header">
    <h1>My Profile</h1>
    <p>Manage your personal information</p>
</div>

<div class="grid grid-2">
    <div class="card">
        <h2>Personal Information</h2>
        <div class="form-group">
            <label>First Name</label>
            <input type="text" placeholder="Mary">
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text" placeholder="Mensah">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="tenant@example.com" disabled>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="+233 XX XXX XXXX">
        </div>
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date">
        </div>
        <button class="button button-block">💾 Save Profile</button>
    </div>

    <div class="card">
        <h2>Employment & Income</h2>
        <div class="form-group">
            <label>Employer Name</label>
            <input type="text" placeholder="Your Employer">
        </div>
        <div class="form-group">
            <label>Monthly Income (GHS)</label>
            <input type="number" placeholder="0.00" step="0.01">
        </div>
        <div class="form-group">
            <label>Job Title</label>
            <input type="text" placeholder="Your Job Title">
        </div>
        
        <h3 style="margin-top: 1.5rem;">Emergency Contact</h3>
        <div class="form-group">
            <label>Name</label>
            <input type="text" placeholder="Contact Name">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="tel" placeholder="+233 XX XXX XXXX">
        </div>
        <div class="form-group">
            <label>Relationship</label>
            <input type="text" placeholder="e.g., Parent, Sibling">
        </div>
        <button class="button button-block">💾 Save Information</button>
    </div>
</div>
{% endblock %}
