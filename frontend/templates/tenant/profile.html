{% extends "base.html" %}
{% block title %}My Profile - RentFlow{% endblock %}
{% block content %}
<div class="header"><h1>My Profile</h1></div>
<div style="max-width: 600px;">
    <div class="card">
        <h2>Personal Information</h2>
        <form id="profileForm">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" value="" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" value="" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="" disabled>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" value="">
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" value="">
            </div>
            <div class="form-group">
                <label for="employer">Employer</label>
                <input type="text" id="employer" value="">
            </div>
            <div class="form-group">
                <label for="income">Monthly Income (GHS)</label>
                <input type="number" id="income" step="0.01" value="">
            </div>
            <button type="submit" class="button">Save Profile</button>
        </form>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h2>Emergency Contact</h2>
        <form id="emergencyForm">
            <div class="form-group">
                <label for="emergencyName">Name</label>
                <input type="text" id="emergencyName" value="">
            </div>
            <div class="form-group">
                <label for="emergencyPhone">Phone</label>
                <input type="tel" id="emergencyPhone" value="">
            </div>
            <div class="form-group">
                <label for="emergencyRelation">Relationship</label>
                <input type="text" id="emergencyRelation" value="">
            </div>
            <button type="submit" class="button">Save Emergency Contact</button>
        </form>
    </div>
</div>
{% endblock %}
