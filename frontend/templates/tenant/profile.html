{% extends "base_tenant.html" %}

{% block title %}Profile — RentFlow{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Profile settings</h1>
        <p class="page-subtitle">Keep your contact details and personal profile information up to date.</p>
    </div>
    <a href="/tenant/profile/edit/" class="button">Edit profile</a>
</div>

<div class="grid-cols-2">
    <div class="card form-card">
        <h2 class="card-title">Personal information</h2>
        <div class="form-group"><label>Name</label><input value="{{ user.full_name }}" disabled></div>
        <div class="form-group"><label>Email</label><input value="{{ user.email }}" disabled></div>
        <div class="form-group"><label>Phone</label><input value="{{ user.phone_number|default:'Not set' }}" disabled></div>
    </div>
    <div class="card form-card">
        <h2 class="card-title">Lease summary</h2>
        <div class="form-group"><label>Property</label><input value="{{ lease.property_name }}" disabled></div>
        <div class="form-group"><label>Unit</label><input value="{{ lease.unit_name }}" disabled></div>
        <div class="form-group"><label>Lease ends</label><input value="{{ lease.end_date|date:'M d, Y' }}" disabled></div>
    </div>
</div>
{% endblock %}
