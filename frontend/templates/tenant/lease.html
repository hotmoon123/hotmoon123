{% extends "base_tenant.html" %}

{% block title %}Lease — RentFlow{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Lease details</h1>
        <p class="page-subtitle">Review your agreement, rental terms, and upcoming renewal timeline.</p>
    </div>
    <a href="/tenant/lease/download/" class="button">Download lease</a>
</div>

<div class="grid-cols-2">
    <div class="card">
        <h2 class="card-title">Lease summary</h2>
        <div class="input-group">
            <div class="form-group"><label>Property</label><input value="{{ lease.property_name }}" disabled></div>
            <div class="form-group"><label>Unit</label><input value="{{ lease.unit_name }}" disabled></div>
            <div class="form-group"><label>Start date</label><input value="{{ lease.start_date|date:'M d, Y' }}" disabled></div>
            <div class="form-group"><label>End date</label><input value="{{ lease.end_date|date:'M d, Y' }}" disabled></div>
            <div class="form-group"><label>Monthly rent</label><input value="GHS {{ lease.monthly_rent }}" disabled></div>
        </div>
    </div>
    <div class="card">
        <h2 class="card-title">Payment cadence</h2>
        <div class="form-group"><label>Next payment</label><input value="GHS {{ lease.next_payment_amount }}" disabled></div>
        <div class="form-group"><label>Next due</label><input value="{{ lease.next_payment_due|date:'M d, Y' }}" disabled></div>
        <div class="form-group"><label>Lease status</label><input value="{{ lease.status }}" disabled></div>
        <div class="form-group"><label>Security deposit</label><input value="GHS {{ lease.deposit_amount }}" disabled></div>
    </div>
</div>
{% endblock %}
