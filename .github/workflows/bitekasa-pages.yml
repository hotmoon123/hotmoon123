name: Deploy BiteKasa to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'bitekasa-site/**'
      - '.github/workflows/bitekasa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitekasa-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitekasa-site
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bitekasa-site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Automated tests and coverage gate
        run: npm run test:coverage
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build production site
        run: npm run build -- --base=/hotmoon123/
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      - name: Enforce compressed bundle budgets
        run: npm run check:bundle
      - name: Check SEO metadata and sitemap
        run: npm run check:seo
      - name: Verify required pages and discovery files
        run: |
          test -s dist/index.html
          test -s dist/services/fried/index.html
          test -s dist/services/unfried/index.html
          test -s dist/services/frozen/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/privacy.html
      - name: Build MYST WATER concept site into Pages subpath
        working-directory: mystwater-site
        run: |
          npm ci
          npm run typecheck
          npm run build -- --base=/hotmoon123/mystwater/
          npm run check:content
          npm run check:bundle
          mkdir -p ../bitekasa-site/dist/mystwater
          cp -r dist/. ../bitekasa-site/dist/mystwater/
      - name: Verify MYST WATER concept site files
        run: |
          test -s bitekasa-site/dist/mystwater/index.html
          test -s bitekasa-site/dist/mystwater/privacy.html
          test -s bitekasa-site/dist/mystwater/robots.txt
          test -f bitekasa-site/dist/mystwater/assets/myst-logo.jpg
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bitekasa-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
