- id: S51
  title: "Upwork pricing and freelancer service fees (2026)"
  author: "Upwork / third-party fee analyses"
  year: 2026
  url: "https://www.upwork.com/i/pricing"
  verified: true
  claim: "Freelancers pay a per-contract service fee reported in the 0–15% range with most contracts around 10% in 2026; clients pay a marketplace fee of roughly 5% plus a one-time contract initiation fee. Sources disagree on whether the 10% is now flat — treat the exact rate as needing confirmation from Upwork's own help centre."
- id: S52
  title: "Toptal screening and pricing structure (2026)"
  author: "Toptal / third-party reviews"
  url: "https://www.toptal.com/top-3-percent"
  verified: true
  claim: "Toptal accepts fewer than ~3% of applicants via a multi-stage screen including a live interview and a test project; freelancers pay no fee and Toptal bills clients an undisclosed markup (reported 30–50%) on top of a $60–$200+/hr rate, plus a monthly platform subscription."
- id: S53
  title: "Braintrust fee model"
  author: "Braintrust"
  url: "https://www.usebraintrust.com/"
  verified: true
  claim: "Braintrust charges talent 0% and clients a flat 10% fee, with token-based (BTRST) community governance."
- id: S54
  title: "Fiverr seller commission and buyer service fee (2026)"
  author: "Fiverr / third-party fee analyses"
  url: "https://www.fiverr.com/support/articles/360010560118"
  verified: true
  claim: "Fiverr charges sellers a flat 20% commission on order value; buyers pay a 5.5% service fee plus a small-order fee on orders under $200; earnings clear after 14 days (7 for higher tiers)."
- id: S55
  title: "Andela business model and engagement terms (2026)"
  author: "Andela / third-party reviews"
  url: "https://www.andela.com/"
  verified: true
  claim: "Andela (founded Lagos 2014) places vetted engineers — acceptance reported near 0.5% — into client teams on long contracts (commonly 12-month minimums) at roughly $6,000–$14,000 per developer per month; talent are contractors, not employees; no short-term freelance tier; revenue is majority enterprise in North America and Western Europe."
- id: S56
  title: "Stripe merchant availability in Ghana"
  author: "Stripe / Paystack"
  url: "https://stripe.com/global"
  verified: true
  claim: "Stripe does not support Ghana as a direct merchant country; Ghana is reached through Stripe's extended network via Paystack (a Stripe company). A Ghana-registered company cannot open a standard Stripe account, and Stripe Connect Custom is therefore not directly available to a Ghanaian entity."
- id: S57
  title: "African and Ghanaian freelance platforms (landscape)"
  author: "Tech In Africa / Truelancer / Twine listings"
  url: "https://www.truelancer.com/software-development-freelancers-in-accra"
  verified: true
  claim: "Ghana-focused and pan-African freelance platforms exist (e.g. CediJob, Gebeya, TERAWORK, Findworka, Solangigs) alongside global platforms listing Accra-based developers; public listings show Accra developers priced from about $2–$10/hr upward, anchoring local talent to global low-price competition."
- id: S58
  title: "Value Added Tax Act, 2025 (Act 1151) — Ghana"
  author: "Ghana Revenue Authority / Parliament of Ghana"
  url: "https://www.modernghana.com/news/1460334/new-vat-act-takes-effect-january-1-2026-as-gra.html"
  verified: true
  claim: "Ghana's Value Added Tax Act, 2025 (Act 1151) took effect 1 January 2026, replacing the previous regime with a unified 20% charge (VAT 15% + NHIL 2.5% + GETFund 2.5% on the same taxable value); it abolishes the COVID-19 Health Recovery Levy, raises the VAT registration threshold for goods from GHS 200,000 to GHS 750,000, and makes NHIL and GETFund creditable as input tax."
- id: S59
  title: "Codementor — on-demand developer help marketplace"
  author: "Codementor / MentorCruise review / sefism platform profile"
  url: "https://mentorcruise.com/blog/codementor-review-is-it-the-coding-mentor-youve-been-dreaming-of/"
  verified: false
  claim: "Codementor is an on-demand one-to-one developer help marketplace; mentors set their own rates (reported $8–$15 per 15 minutes for newer mentors, $15–$30 for experienced), seats carry a 15-minute minimum then per-minute billing plus a service fee, most mentors respond within 10–30 minutes, and the site claims 12,000+ available developers. The platform fee is reported at 10–20% but that figure dates from a 2015 report and current terms were not verified."
- id: S60
  title: "Growwr — AI-vetted African freelance platform"
  author: "Techpoint Africa"
  url: "https://techpoint.africa/insight/growwr-startup-feature/"
  verified: false
  claim: "Growwr, launched May 2024 and based in Lagos, uses three proprietary AI systems (crawler, behavioural interview, matching) to vet African talent; the founders claim $1.5M paid out to talent, 3,000 businesses served, 19,000 applicants reduced to 1,100 vetted candidates (~5.8%), a team of eight, and operations across 13 countries including Ghana as its first customer."
- id: S61
  title: "TERAWORK — Nigerian freelance marketplace with native apps"
  author: "Techtrends Africa / Tech In Africa"
  url: "https://techtrends.africa/terawork-nigerian-recruitment-startup-launches-app-to-help-employers-hire/"
  verified: false
  claim: "TERAWORK (founded 2018, Lagos) offers a freelance marketplace with payment escrow, task management, and post-work reviews, and ships native iOS and Android apps; reported at 15,000 freelancers and 6,000+ transactions, operating in Nigeria, Kenya, Ghana, the UK and North America."
- id: S62
  title: "Hamzry — Nigerian freelancer marketplace launch (2025)"
  author: "Vanguard Nigeria"
  url: "https://www.vanguardngr.com/2025/05/platform-launches-to-connect-nigerian-freelancers-to-global-clients/"
  verified: false
  claim: "Hamzry launched in 2025 as a Nigerian-focused freelance marketplace with naira-native payments, reporting 1,800 freelancers signed up at launch, positioned against the difficulty Nigerian freelancers face getting noticed and paid on global platforms."
