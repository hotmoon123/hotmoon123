# TechBro Blueprint — Artefact Manifest (single source of truth)
# id   : stable integer, rendered as ART-###
# name : artefact name
# cell : discover | define | architect | build | assure | secure | deploy | sustain
# owner: role id that is accountable (see roles/*.yaml)
# dod  : definition of done — how we know it is finished and not fiction
# std  : source key from sources.yaml, or null if it is an internal convention
#
# Rule: an artefact without a DoD is not an artefact, it is a wish.
- {id: 1,   name: "Vision & Mission Canvas",                  cell: discover,  owner: D01,  std: null,     dod: "One page; names the user, the pain, the promise, and the 12-month bet; founder signs it."}
- {id: 2,   name: "Lean Canvas",                               cell: discover,  owner: D04,  std: S1,       dod: "All 9 blocks filled; every 'unfair advantage' claim has evidence or is labelled a hypothesis."}
- {id: 3,   name: "Business Model Canvas",                      cell: discover,  owner: D04,  std: S1,       dod: "Two canvases: MVP model and 24-month model; unit economics consistent with ART-011."}
- {id: 4,   name: "Market Sizing Model (TAM/SAM/SOM)",           cell: discover,  owner: D06,  std: null,     dod: "Bottom-up build from public counts; every input has a source and a date; formula visible."}
- {id: 5,   name: "Competitive Landscape Matrix",                cell: discover,  owner: D07,  std: null,     dod: ">=8 comparables (GH + Africa + global); columns are buyer-verifiable facts, not vibes."}
